apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-apps
spec:
  interval: 1m
  url: ${GIT_REPO}
  ref:
    branch: ${GIT_BRANCH}
  secretRef:
    name: git-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${NAMESPACE}
spec:
  serviceAccountName: ${FLUX_SERVICE_ACCOUNT_NAME}
  targetNamespace: ${NAMESPACE}
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-apps
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age