apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: iot-s
  namespace: flux-system
spec:
  dependsOn:
    - name: kyverno-policies
  interval: 5m
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./tenants/acme-dns
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      GIT_REPO: "https://github.com/opipenbe/iot-s"
      GIT_BRANCH: "main"
      NAMESPACE: "iot-s"
      FLUX_SERVICE_ACCOUNT_NAME: "flux"